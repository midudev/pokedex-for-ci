on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-18.04
    steps:  
      - uses: actions/checkout@v2
        with: 
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24     
      - name: Install dependecies
        run: npm Install
      - name: Lint
        run: npm run eslint
      
      
